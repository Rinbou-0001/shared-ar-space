<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>space2 YouTube UI (mobile)</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #site-frame {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
    display: block;
  }
  #status {
    position: fixed;
    top: env(safe-area-inset-top, 4px);
    right: 4px;
    z-index: 100;
    font-size: 10px;
    color: #333;
    background: rgba(255,255,255,0.9);
    padding: 3px 7px;
    border-radius: 3px;
    pointer-events: none;
    border: 1px solid #ddd;
  }
  #log {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 4px);
    left: 4px; right: 4px;
    max-height: 80px;
    overflow: hidden;
    font-family: monospace;
    font-size: 9px;
    color: rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 100;
    background: rgba(255,255,255,0.7);
    padding: 2px 4px;
    border-radius: 3px;
  }
  #log div { line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<iframe id="site-frame" src="/sites/youtube-ui-study/" allow="autoplay; fullscreen"></iframe>
<div id="status">接続中…</div>
<div id="log"></div>

<script src="/config.js"></script>
<script>
  (function () {
    const cfg = window.APP_CONFIG || {};
    const base = cfg.socketUrl ? cfg.socketUrl.replace(/\/$/, '') : '';
    const s = document.createElement('script');
    s.src = base + '/socket.io/socket.io.js';
    s.onload = () => { if (window.__spaceYtInit) window.__spaceYtInit(); };
    document.head.appendChild(s);
  })();
</script>
<script src="/space2-youtube.js"></script>
</body>
</html>
