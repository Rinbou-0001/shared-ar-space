<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube UI Study - 動画</title>
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-toggle" aria-label="メニュー">☰</button>
    <a class="brand" href="index.html"><span class="brand-mark">▶</span><strong>YouTube</strong><small>UI Study</small></a>
    <form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="検索" aria-label="検索"><button aria-label="検索">⌕</button></form>
    <button class="icon-btn mic" aria-label="音声検索">🎙</button>
    <div class="top-actions"><button class="pill-button" id="createBtn">＋ 作成</button><button class="icon-btn" aria-label="通知">♧</button><button class="avatar">R</button></div>
  </header>
  <aside class="sidebar" id="sidebar">
    <a class="side-item" href="index.html"><span>⌂</span>ホーム</a><a class="side-item" href="#"><span>▣</span>ショート</a><a class="side-item" href="#"><span>▤</span>登録チャンネル</a><hr><a class="side-item" href="#"><span>▶</span>マイページ</a><a class="side-item" href="#"><span>◷</span>履歴</a><a class="side-item" href="#"><span>▱</span>再生リスト</a>
  </aside>
  <main class="watch-layout">
    <section class="watch-primary">
      <div class="player" id="player"><div class="play-button">▶</div><div class="player-controls"><span>▶</span><span>0:00 / 12:48</span><span class="control-spacer"></span><span>⚙</span><span>⛶</span></div></div>
      <h1 id="watchTitle">動画タイトル</h1>
      <div class="video-toolbar"><div class="channel"><div class="channel-avatar">D</div><div><strong>Design Lab</strong><small>チャンネル登録者数 12.4万人</small></div><button class="subscribe">チャンネル登録</button></div><div class="toolbar-actions"><button>👍 1.2万</button><button>↗ 共有</button><button>⋯</button></div></div>
      <div class="description"><strong>18万 回視聴　3日前</strong><p>この動画ページは、プレイヤー・チャンネル情報・アクション・概要欄・コメント欄の配置を学ぶためのサンプルです。</p><a href="#">もっと見る</a></div>
      <section class="comments"><h2>コメント 328件</h2><div class="comment-entry"><div class="avatar">R</div><input placeholder="コメントを追加..." aria-label="コメントを追加"></div><article class="comment"><div class="comment-avatar">A</div><div><strong>Akira</strong><small> 2日前</small><p>UIの構造が分かりやすくて参考になります。</p><span>👍 42　返信</span></div></article></section>
    </section>
    <aside class="recommendations" id="recommendations"></aside>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
